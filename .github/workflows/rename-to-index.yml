name: Rename demo file to index.html

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rename-to-index.yml'

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file to index.html
        run: |
          if [ -f demo-web-cafeteria-con-analitica.html ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git mv demo-web-cafeteria-con-analitica.html index.html
            git commit -m "Rename demo file to index.html"
            git push
          else
            echo "Source file not found; index.html may already exist."
            ls -la
          fi
